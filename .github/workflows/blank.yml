name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show repo files
        run: |
          ls -la

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy moviepy imageio imageio-ffmpeg

      - name: Run video generator
        run: |
          ls -la
          python gerar_video_mp4.py

      - name: Upload output video
        uses: actions/upload-artifact@v4
        with:
          name: encarte-video
          path: |
            ${{ github.workspace }}/encarte_tutorial.mp4
